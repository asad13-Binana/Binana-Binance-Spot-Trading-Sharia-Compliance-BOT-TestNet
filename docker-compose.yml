name: binana-testnet

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  universe:
    build:
      context: .
      dockerfile: Dockerfile.services
    image: binana-testnet-services:${RELEASE_TAG:-local}
    command: python -m services.market_context.universe_main
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    restart: unless-stopped
    environment:
      BOT_PRODUCT: ${BOT_PRODUCT:?set BOT_PRODUCT}
      BOT_ENVIRONMENT: ${BOT_ENVIRONMENT:?set BOT_ENVIRONMENT}
      BOT_INSTANCE_ID: ${BOT_INSTANCE_ID:?set BOT_INSTANCE_ID}
      SHARED_ROOT: /app/shared
      UNIVERSE_ROOT: /app/shared/universe
      SHARIA_FILE: /app/shared/sharia/sharia_status.json
      SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64: ${SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64:?set SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64}
      LEGACY_HALAL_FILE: /app/shared/sharia/halal_coins.json
      UNIVERSE_LIMIT: ${UNIVERSE_LIMIT:-50}
      UNIVERSE_REFRESH_SECONDS: ${UNIVERSE_REFRESH_SECONDS:-900}
      MIN_LISTING_AGE_DAYS: ${MIN_LISTING_AGE_DAYS:-30}
      MIN_QUOTE_VOLUME_USDT: ${MIN_QUOTE_VOLUME_USDT:-1000000}
      MAX_SPREAD_RATIO: ${MAX_SPREAD_RATIO:-0.005}
      STABLECOINS: ${STABLECOINS:-USDC,FDUSD,TUSD,USDP,DAI,EUR,AEUR,BUSD}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-15}
      # CI-NETWORK-001: the scanner already reads BINANCE_PUBLIC_BASE, but
      # it was never passed into the container, so it could not be pointed
      # anywhere else. The default is unchanged, so production behaviour is
      # identical; CI overrides it because api.binance.com answers 451
      # (Unavailable For Legal Reasons) to GitHub hosted runner IPs.
      BINANCE_PUBLIC_BASE: ${BINANCE_PUBLIC_BASE:-https://api.binance.com}
      # Public Spot microstructure is advisory evidence only.  It runs inside
      # this credential-free container, uses one multiplexed WebSocket for
      # aggTrade+bookTicker, and cannot place or modify an order.
      ENABLE_SPOT_MICROSTRUCTURE: ${ENABLE_SPOT_MICROSTRUCTURE:-true}
      BINANCE_SPOT_MARKET_STREAM: ${BINANCE_SPOT_MARKET_STREAM:-wss://data-stream.binance.vision/ws}
      MARKET_CONTEXT_FILE: /app/shared/market_context/current.json
      MARKET_CONTEXT_HEALTH_FILE: /app/shared/runtime/market_context/health.json
      MARKET_CONTEXT_PUBLISH_SECONDS: ${MARKET_CONTEXT_PUBLISH_SECONDS:-5}
      MARKET_CONTEXT_UNIVERSE_POLL_SECONDS: ${MARKET_CONTEXT_UNIVERSE_POLL_SECONDS:-15}
      MARKET_CONTEXT_MAX_AGE_MS: ${MARKET_CONTEXT_MAX_AGE_MS:-15000}
      MARKET_CONTEXT_EVIDENCE_MAX_AGE_SECONDS: ${MARKET_CONTEXT_EVIDENCE_MAX_AGE_SECONDS:-30}
      MARKET_CONTEXT_ROTATION_SECONDS: ${MARKET_CONTEXT_ROTATION_SECONDS:-82200}
      UNIVERSE_SNAPSHOT_MAX_FILES: ${UNIVERSE_SNAPSHOT_MAX_FILES:-10000}
      # External CoinGecko/CMC enrichment (V10.2-EXT-001, advisory only,
      # disabled by default). Budget values are HARD safety ceilings 4% under
      # the documented free tiers; runtime clamps anything higher.
      ENABLE_COINGECKO_SIGNALS: ${ENABLE_COINGECKO_SIGNALS:-false}
      ENABLE_CMC_TRENDING: ${ENABLE_CMC_TRENDING:-false}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINMARKETCAP_API_KEY: ${COINMARKETCAP_API_KEY:-}
      CMC_API_KEY: ${CMC_API_KEY:-}
      EXTERNAL_SIGNALS_REFRESH_SECONDS: ${EXTERNAL_SIGNALS_REFRESH_SECONDS:-1800}
      EXTERNAL_MIN_MARKET_CAP_USD: ${EXTERNAL_MIN_MARKET_CAP_USD:-0}
      CMC_TRENDING_LIMIT: ${CMC_TRENDING_LIMIT:-20}
      COINGECKO_PER_MINUTE_LIMIT: ${COINGECKO_PER_MINUTE_LIMIT:-96}
      COINGECKO_MONTHLY_LIMIT: ${COINGECKO_MONTHLY_LIMIT:-9600}
      CMC_PER_MINUTE_LIMIT: ${CMC_PER_MINUTE_LIMIT:-48}
      CMC_MONTHLY_LIMIT: ${CMC_MONTHLY_LIMIT:-14400}
      EXTERNAL_BREAKER_COOLDOWN_SECONDS: ${EXTERNAL_BREAKER_COOLDOWN_SECONDS:-900}
      CMC_RECONCILE_SECONDS: ${CMC_RECONCILE_SECONDS:-21600}
      AUDIT_LOG: /app/shared/audit/events.jsonl
      AUDIT_LOG_MAX_BYTES: ${AUDIT_LOG_MAX_BYTES:-10485760}
      AUDIT_LOG_BACKUPS: ${AUDIT_LOG_BACKUPS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${SHARED_HOST_PATH:-./shared}:/app/shared
      - ${SHARED_HOST_PATH:-./shared}/sharia:/app/shared/sharia:ro
    mem_limit: 180m
    cpus: 0.07
    pids_limit: 96
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,time;d=json.load(open('/app/shared/universe/status.json'));a=time.time()-__import__('datetime').datetime.fromisoformat(d['generated_at'].replace('Z','+00:00')).timestamp();assert -30<=a<1800\""]
      interval: 30s
      timeout: 8s
      retries: 5
    logging: *default-logging
    networks: [control, runtime-egress]

  sharia-egress-proxy:
    image: binana-testnet-services:${RELEASE_TAG:-local}
    command: python -m services.sharia_egress_proxy.server
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    restart: unless-stopped
    environment:
      BOT_PRODUCT: ${BOT_PRODUCT:?set BOT_PRODUCT}
      BOT_ENVIRONMENT: ${BOT_ENVIRONMENT:?set BOT_ENVIRONMENT}
      BOT_INSTANCE_ID: ${BOT_INSTANCE_ID:?set BOT_INSTANCE_ID}
      SHARIA_PROXY_LISTEN_HOST: 0.0.0.0
      SHARIA_PROXY_LISTEN_PORT: "8080"
      SHARIA_PROXY_CONNECT_TIMEOUT: ${SHARIA_PROXY_CONNECT_TIMEOUT:-15}
      SHARIA_PROXY_IDLE_TIMEOUT: ${SHARIA_PROXY_IDLE_TIMEOUT:-30}
      SHARIA_PROXY_MAX_CONNECTIONS: ${SHARIA_PROXY_MAX_CONNECTIONS:-16}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # The proxy alone has an Internet-capable network. It resolves once,
    # rejects any non-global answer, and connects to the validated numeric IP.
    # It receives no Binance, Telegram, signing or approval secrets.
    networks:
      - runtime-egress
      - sharia-egress
    mem_limit: 50m
    cpus: 0.03
    pids_limit: 64
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;s=socket.create_connection(('127.0.0.1',8080),3);s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  sharia-screener:
    image: binana-testnet-services:${RELEASE_TAG:-local}
    command: python -m services.sharia_screener.service
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    restart: unless-stopped
    depends_on:
      universe:
        condition: service_healthy
      sharia-egress-proxy:
        condition: service_healthy
    environment:
      BOT_PRODUCT: ${BOT_PRODUCT:?set BOT_PRODUCT}
      BOT_ENVIRONMENT: ${BOT_ENVIRONMENT:?set BOT_ENVIRONMENT}
      BOT_INSTANCE_ID: ${BOT_INSTANCE_ID:?set BOT_INSTANCE_ID}
      EXECUTION_MODE: ${EXECUTION_MODE:-simulation}
      SHARED_ROOT: /app/shared
      SHARIA_FILE: /app/shared/sharia/sharia_status.json
      SHARIA_CONTROLLER_FILE: /app/shared/sharia/HALAL_CRYPTO_SPOT_SCREENING_V19_1_PRODUCTION.json
      LEGACY_HALAL_FILE: /app/shared/sharia/halal_coins.json
      UNIVERSE_FILE: /app/shared/universe/current_pairlist.json
      SHARIA_SOURCE_REGISTRY: /app/shared/sharia/source_registry.json
      SHARIA_EVIDENCE_DIR: /app/shared/sharia/evidence
      SHARIA_DISCOVERY_DIR: /app/shared/sharia/discovery
      SHARIA_AUTO_SOURCE_DISCOVERY_ENABLED: ${SHARIA_AUTO_SOURCE_DISCOVERY_ENABLED:-true}
      SHARIA_SOURCE_REFRESH_DAYS: ${SHARIA_SOURCE_REFRESH_DAYS:-7}
      SHARIA_SOURCE_FAILURE_REFRESH_HOURS: ${SHARIA_SOURCE_FAILURE_REFRESH_HOURS:-24}
      SHARIA_ARCHIVE_RETENTION_DAYS: ${SHARIA_ARCHIVE_RETENTION_DAYS:-90}
      SHARIA_SOURCE_API_TIMEOUT_SECONDS: ${SHARIA_SOURCE_API_TIMEOUT_SECONDS:-15}
      SHARIA_SOURCE_BREAKER_COOLDOWN_SECONDS: ${SHARIA_SOURCE_BREAKER_COOLDOWN_SECONDS:-900}
      SHARIA_COINGECKO_PER_MINUTE_LIMIT: ${SHARIA_COINGECKO_PER_MINUTE_LIMIT:-12}
      SHARIA_COINGECKO_MONTHLY_LIMIT: ${SHARIA_COINGECKO_MONTHLY_LIMIT:-8000}
      SHARIA_CMC_PER_MINUTE_LIMIT: ${SHARIA_CMC_PER_MINUTE_LIMIT:-6}
      SHARIA_CMC_MONTHLY_LIMIT: ${SHARIA_CMC_MONTHLY_LIMIT:-3000}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINMARKETCAP_API_KEY: ${COINMARKETCAP_API_KEY:-}
      CMC_API_KEY: ${CMC_API_KEY:-}
      SHARIA_IDLE_SCAN_ENABLED: ${SHARIA_IDLE_SCAN_ENABLED:-true}
      MAX_UNIVERSE_AGE_SECONDS: ${MAX_UNIVERSE_AGE_SECONDS:-1800}
      SHARIA_MAX_SCANS_PER_DAY: ${SHARIA_MAX_SCANS_PER_DAY:-1000}
      SHARIA_MIN_SECONDS_BETWEEN_SCANS: ${SHARIA_MIN_SECONDS_BETWEEN_SCANS:-10}
      SHARIA_IDLE_CYCLE_SECONDS: ${SHARIA_IDLE_CYCLE_SECONDS:-300}
      SHARIA_RESULT_TTL_DAYS: ${SHARIA_RESULT_TTL_DAYS:-90}
      SHARIA_RESCAN_INTERVAL_DAYS: ${SHARIA_RESCAN_INTERVAL_DAYS:-7}
      SHARIA_FAILED_RETRY_SECONDS: ${SHARIA_FAILED_RETRY_SECONDS:-21600}
      SHARIA_FAILED_RETRY_MAX_SECONDS: ${SHARIA_FAILED_RETRY_MAX_SECONDS:-86400}
      SHARIA_IDLE_MAX_ATTEMPTS: ${SHARIA_IDLE_MAX_ATTEMPTS:-3}
      SHARIA_HMAC_KEY: ${SHARIA_HMAC_KEY:?set SHARIA_HMAC_KEY}
      SHARIA_APPROVAL_HMAC_KEY: ${SHARIA_APPROVAL_HMAC_KEY:?set SHARIA_APPROVAL_HMAC_KEY}
      SHARIA_RESULT_HMAC_KEY: ${SHARIA_RESULT_HMAC_KEY:?set SHARIA_RESULT_HMAC_KEY}
      SHARIA_RESULT_SIGNING_PRIVATE_KEY_B64: ${SHARIA_RESULT_SIGNING_PRIVATE_KEY_B64:?set SHARIA_RESULT_SIGNING_PRIVATE_KEY_B64}
      SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64: ${SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64:?set SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64}
      # This container has only an internal Docker network. HTTPS can leave
      # solely through the pinned-destination CONNECT proxy above; the
      # application-level peer check remains a second fail-closed layer.
      HTTPS_PROXY: http://sharia-egress-proxy:8080
      HTTP_PROXY: http://sharia-egress-proxy:8080
      https_proxy: http://sharia-egress-proxy:8080
      http_proxy: http://sharia-egress-proxy:8080
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      SHARIA_PINNED_EGRESS_PROXY: "true"
      ENVELOPE_RELEASE_HASH: ${SIDECAR_RELEASE_HASH:-}
      AUDIT_LOG: /app/shared/audit/events.jsonl
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${SHARED_HOST_PATH:-./shared}:/app/shared
      - ${SHARED_HOST_PATH:-./shared}/universe:/app/shared/universe:ro
    networks:
      - sharia-egress
    mem_limit: 200m
    cpus: 0.08
    pids_limit: 96
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,time;d=json.load(open('/app/shared/runtime/sharia_screener/health.json'));assert d['ok'] and time.time()-d['ts']<180\""]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    logging: *default-logging

  freqtrade:
    image: freqtradeorg/freqtrade:2026.6@sha256:d451af021d5e08b70580c0eea5848534e9846b57391b34821c0a5814416397e6
    restart: unless-stopped
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    depends_on:
      universe:
        condition: service_healthy
    environment:
      BOT_PRODUCT: ${BOT_PRODUCT:?set BOT_PRODUCT}
      BOT_ENVIRONMENT: ${BOT_ENVIRONMENT:?set BOT_ENVIRONMENT}
      BOT_INSTANCE_ID: ${BOT_INSTANCE_ID:?set BOT_INSTANCE_ID}
      FREQTRADE__API_SERVER__ENABLED: "true"
      FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS: "0.0.0.0"
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE_API_USERNAME:-freqtrade}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE_API_PASSWORD:?set FREQTRADE_API_PASSWORD}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE_API_JWT_SECRET:?set FREQTRADE_API_JWT_SECRET}
      FREQTRADE__API_SERVER__WS_TOKEN: ${FREQTRADE_API_WS_TOKEN:?set FREQTRADE_API_WS_TOKEN}
      SHARIA_FILE: /freqtrade/shared/sharia/sharia_status.json
      UNIVERSE_FILE: /freqtrade/shared/universe/current_pairlist.json
      SIGNAL_INBOX: /freqtrade/shared/signals/inbox
      SIGNAL_PROCESSED: /freqtrade/shared/signals/processed
      SIGNAL_REJECTED: /freqtrade/shared/signals/rejected
      SIGNAL_HEARTBEAT: /freqtrade/shared/freqtrade/signal_seam_heartbeat.json
      SIGNAL_HMAC_KEY: ${SIGNAL_HMAC_KEY:?set SIGNAL_HMAC_KEY}
      ENVELOPE_RELEASE_HASH: ${SIDECAR_RELEASE_HASH:-}
      PYTHONPATH: /freqtrade/services_src
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./freqtrade/user_data/config.json:/freqtrade/user_data/config.json:ro
      - ./freqtrade/user_data/strategies:/freqtrade/user_data/strategies:ro
      - ./services:/freqtrade/services_src/services:ro
      - ./RELEASE_SHA256.txt:/freqtrade/services_src/RELEASE_SHA256.txt:ro
      - ${SHARED_HOST_PATH:-./shared}:/freqtrade/shared
      - ${SHARED_HOST_PATH:-./shared}/sharia:/freqtrade/shared/sharia:ro
      - ${SHARED_HOST_PATH:-./shared}/universe:/freqtrade/shared/universe:ro
    command: >-
      trade --logfile /freqtrade/shared/freqtrade/logs/freqtrade.log
      --config /freqtrade/user_data/config.json --strategy IctSmcStrategy
    mem_limit: 520m
    cpus: 0.15
    pids_limit: 192
    cap_drop: [ALL]
    tmpfs: [/tmp:size=64m,mode=1777]
    stop_grace_period: 2m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;assert urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ping',timeout=4).status==200\""]
      interval: 30s
      timeout: 8s
      retries: 8
    logging: *default-logging
    networks: [control, runtime-egress]

  execution-sidecar:
    image: binana-testnet-services:${RELEASE_TAG:-local}
    command: python -m services.execution_sidecar.guarded_main
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    restart: unless-stopped
    depends_on:
      universe:
        condition: service_healthy
      sharia-screener:
        condition: service_healthy
    environment:
      BOT_PRODUCT: ${BOT_PRODUCT:?set BOT_PRODUCT}
      BOT_ENVIRONMENT: ${BOT_ENVIRONMENT:?set BOT_ENVIRONMENT}
      BOT_INSTANCE_ID: ${BOT_INSTANCE_ID:?set BOT_INSTANCE_ID}
      EXECUTION_MODE: ${EXECUTION_MODE:-simulation}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-true}
      TRADE_SIZE_USDT: ${TRADE_SIZE_USDT:-100}
      MAX_POSITIONS: ${MAX_POSITIONS:-2}
      AUTO_CONFIRM: ${AUTO_CONFIRM:-false}
      SHARED_ROOT: /app/shared
      MARKET_CONTEXT_FILE: /app/shared/market_context/current.json
      MARKET_CONTEXT_EVIDENCE_MAX_AGE_SECONDS: ${MARKET_CONTEXT_EVIDENCE_MAX_AGE_SECONDS:-30}
      CAPTURE_SIGNAL_MARKET_CONTEXT: ${CAPTURE_SIGNAL_MARKET_CONTEXT:-true}
      MARKET_CONTEXT_SIGNAL_EVIDENCE_DIR: /app/shared/market_context/signal_evidence
      MARKET_CONTEXT_SIGNAL_EVIDENCE_MAX_FILES: ${MARKET_CONTEXT_SIGNAL_EVIDENCE_MAX_FILES:-10000}
      SHARIA_FILE: /app/shared/sharia/sharia_status.json
      LEGACY_HALAL_FILE: /app/shared/sharia/halal_coins.json
      UNIVERSE_FILE: /app/shared/universe/current_pairlist.json
      SIGNAL_INBOX: /app/shared/signals/inbox
      SIGNAL_PROCESSED: /app/shared/signals/processed
      SIGNAL_REJECTED: /app/shared/signals/rejected
      LEGACY_RUNTIME_DIR: /app/shared/legacy_runtime
      SHARIA_SIGNAL_GATE_MODE: ${SHARIA_SIGNAL_GATE_MODE:-cached}
      SIGNAL_SCREENING_TIMEOUT_SECONDS: ${SIGNAL_SCREENING_TIMEOUT_SECONDS:-150}
      MAX_UNIVERSE_AGE_SECONDS: ${MAX_UNIVERSE_AGE_SECONDS:-1800}
      MAX_SIGNAL_AGE_SECONDS: ${MAX_SIGNAL_AGE_SECONDS:-180}
      MAX_CANDLE_AGE_SECONDS: ${MAX_CANDLE_AGE_SECONDS:-180}
      PAIR_COOLDOWN_SECONDS: ${PAIR_COOLDOWN_SECONDS:-60}
      MAX_STOPOUTS_PER_PAIR_DAY: ${MAX_STOPOUTS_PER_PAIR_DAY:-3}
      MAX_STOPOUTS_GLOBAL_DAY: ${MAX_STOPOUTS_GLOBAL_DAY:-10}
      COMMAND_MAX_AGE_SECONDS: ${COMMAND_MAX_AGE_SECONDS:-120}
      COMMAND_RESULT_MAX_FILES: ${COMMAND_RESULT_MAX_FILES:-1000}
      COMMAND_RESULT_MAX_AGE_SECONDS: ${COMMAND_RESULT_MAX_AGE_SECONDS:-86400}
      SIGNAL_ARCHIVE_MAX_FILES: ${SIGNAL_ARCHIVE_MAX_FILES:-10000}
      SQLITE_BACKUP_INTERVAL_SECONDS: ${SQLITE_BACKUP_INTERVAL_SECONDS:-86400}
      SQLITE_BACKUP_RETAIN: ${SQLITE_BACKUP_RETAIN:-14}
      SIGNAL_HMAC_KEY: ${SIGNAL_HMAC_KEY:?set SIGNAL_HMAC_KEY}
      COMMAND_HMAC_KEY: ${COMMAND_HMAC_KEY:?set COMMAND_HMAC_KEY}
      SHARIA_HMAC_KEY: ${SHARIA_HMAC_KEY:?set SHARIA_HMAC_KEY}
      SHARIA_RESULT_HMAC_KEY: ${SHARIA_RESULT_HMAC_KEY:?set SHARIA_RESULT_HMAC_KEY}
      SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64: ${SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64:?set SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64}
      LIVE_EVIDENCE_KEY: ${LIVE_EVIDENCE_KEY:-}
      ENVELOPE_RELEASE_HASH: ${SIDECAR_RELEASE_HASH:-}
      AUDIT_LOG: /app/shared/audit/events.jsonl
      AUDIT_LOG_MAX_BYTES: ${AUDIT_LOG_MAX_BYTES:-10485760}
      AUDIT_LOG_BACKUPS: ${AUDIT_LOG_BACKUPS:-5}
      SIDECAR_RELEASE_HASH: ${SIDECAR_RELEASE_HASH:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${SHARED_HOST_PATH:-./shared}:/app/shared
      - ${SHARED_HOST_PATH:-./shared}/sharia:/app/shared/sharia:ro
      - ${SHARED_HOST_PATH:-./shared}/universe:/app/shared/universe:ro
    mem_limit: 300m
    cpus: 0.08
    pids_limit: 128
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 2m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,time;d=json.load(open('/app/shared/runtime/sidecar_health.json'));assert d['ok'] and time.time()-d['ts']<15\""]
      interval: 20s
      timeout: 8s
      retries: 5
    logging: *default-logging
    networks: [control, runtime-egress]

  telegram-broker:
    image: binana-testnet-services:${RELEASE_TAG:-local}
    command: python -m services.telegram_broker.bot
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    restart: unless-stopped
    depends_on:
      execution-sidecar:
        condition: service_healthy
      freqtrade:
        condition: service_healthy
      sharia-screener:
        condition: service_healthy
    environment:
      BOT_PRODUCT: ${BOT_PRODUCT:?set BOT_PRODUCT}
      BOT_ENVIRONMENT: ${BOT_ENVIRONMENT:?set BOT_ENVIRONMENT}
      BOT_INSTANCE_ID: ${BOT_INSTANCE_ID:?set BOT_INSTANCE_ID}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:?set TELEGRAM_OWNER_CHAT_ID}
      CALLBACK_TTL_SECONDS: ${CALLBACK_TTL_SECONDS:-120}
      FREQTRADE_API_URL: http://freqtrade:8080/api/v1
      FREQTRADE_API_USERNAME: ${FREQTRADE_API_USERNAME:-freqtrade}
      FREQTRADE_API_PASSWORD: ${FREQTRADE_API_PASSWORD:?set FREQTRADE_API_PASSWORD}
      SHARED_ROOT: /app/shared
      EXECUTION_MODE: ${EXECUTION_MODE:-simulation}
      UNIVERSE_LIMIT: ${UNIVERSE_LIMIT:-50}
      MIN_LISTING_AGE_DAYS: ${MIN_LISTING_AGE_DAYS:-30}
      MIN_QUOTE_VOLUME_USDT: ${MIN_QUOTE_VOLUME_USDT:-1000000}
      MAX_SPREAD_RATIO: ${MAX_SPREAD_RATIO:-0.005}
      SHARIA_SIGNAL_GATE_MODE: ${SHARIA_SIGNAL_GATE_MODE:-cached}
      MAX_UNIVERSE_AGE_SECONDS: ${MAX_UNIVERSE_AGE_SECONDS:-1800}
      COMMAND_HMAC_KEY: ${COMMAND_HMAC_KEY:?set COMMAND_HMAC_KEY}
      SHARIA_HMAC_KEY: ${SHARIA_HMAC_KEY:?set SHARIA_HMAC_KEY}
      SHARIA_APPROVAL_HMAC_KEY: ${SHARIA_APPROVAL_HMAC_KEY:?set SHARIA_APPROVAL_HMAC_KEY}
      SHARIA_RESULT_HMAC_KEY: ${SHARIA_RESULT_HMAC_KEY:?set SHARIA_RESULT_HMAC_KEY}
      SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64: ${SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64:?set SHARIA_RESULT_VERIFY_PUBLIC_KEY_B64}
      ENVELOPE_RELEASE_HASH: ${SIDECAR_RELEASE_HASH:-}
      AUDIT_LOG: /app/shared/audit/events.jsonl
      AUDIT_LOG_MAX_BYTES: ${AUDIT_LOG_MAX_BYTES:-10485760}
      AUDIT_LOG_BACKUPS: ${AUDIT_LOG_BACKUPS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${SHARED_HOST_PATH:-./shared}:/app/shared
      - ${SHARED_HOST_PATH:-./shared}/sharia:/app/shared/sharia:ro
      - ${SHARED_HOST_PATH:-./shared}/universe:/app/shared/universe:ro
    mem_limit: 120m
    cpus: 0.04
    pids_limit: 96
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,time;d=json.load(open('/app/shared/runtime/telegram_health.json'));assert d['ok'] and time.time()-d['ts']<70\""]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 60s
    logging: *default-logging
    networks: [control, runtime-egress]

networks:
  control:
    internal: true
  runtime-egress:
  sharia-egress:
    internal: true
