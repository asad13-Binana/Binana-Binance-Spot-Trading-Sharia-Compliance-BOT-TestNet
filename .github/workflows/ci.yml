name: Verify Oracle owner bundle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-owner-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked support and monitoring dependencies
        run: |
          python -m pip install --require-hashes -r requirements.services.lock
          python -m pip install --require-hashes -r monitoring/requirements-monitoring.lock
          python -m pip install -r requirements-dev.txt
      - name: Verify immutable source and offline support contracts
        run: bash deploy/verify_release.sh
      - name: Check the installed support dependency closure
        run: python -m pip check

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install reviewed security tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Critical Python correctness and security checks
        run: |
          python -m ruff check --select E9,F63,F7,F82 .
          python -m bandit -q -r services monitoring scripts runtime_owner/owner runtime_owner/deployment --severity-level high --confidence-level high --skip B413
          python scripts/scan_git_history_secrets.py

  quality-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install locked support, monitoring and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements.services.lock
          python -m pip install --require-hashes -r monitoring/requirements-monitoring.lock
          python -m pip install -r requirements-dev.txt
      - name: Measure every support and monitoring regression with branch coverage
        run: |
          python -m coverage run --branch --source=services,monitoring --data-file=/tmp/binana-coverage -m pytest -q -p no:cacheprovider tests monitoring/tests
          python -m coverage json --data-file=/tmp/binana-coverage -o /tmp/binana-coverage.json
          python scripts/verify_coverage_ratchet.py /tmp/binana-coverage.json --minimum 68 --target 85
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: support-coverage-${{ github.sha }}
          path: /tmp/binana-coverage.json
          if-no-files-found: error

  host-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked fixture dependencies
        run: |
          python -m pip install --require-hashes -r requirements.services.lock
          python -m pip install --require-hashes -r monitoring/requirements-monitoring.lock
          python -m pip install -r requirements-dev.txt
      - name: Execute installer, rollback, renewal and certificate fixtures
        run: >-
          sudo env PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -B -m pytest -q -p no:cacheprovider
          tests/test_owner_monitor_installer.py tests/test_release_host_portability.py tests/test_oracle_release_scope.py
          tests/test_release_renewal_host.py tests/test_owner_release_authorization.py
          tests/test_release_validation_timeout.py tests/test_rollout_accounting.py
          tests/test_runtime_health_permissions.py tests/test_sharia_health_permissions.py
          tests/test_telegram_health_permissions.py
          monitoring/tests/test_owner_snapshot_publication.py

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install reviewed audit tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Audit all six pinned dependency closures
        run: |
          for lock in requirements.services.lock requirements.host.lock requirements.renewal.lock monitoring/requirements-monitoring.lock runtime_owner/deployment/requirements.owner.lock runtime_owner/deployment/requirements.build.lock; do
            python -m pip_audit --strict --no-deps --disable-pip -r "$lock"
          done

  owner-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Materialize the standalone Oracle bundle from pinned public source
        run: python runtime_owner/deployment/materialize_oracle_bundle.py /tmp/oracle-bundle
      - name: Validate the rendered topology without starting services
        run: docker compose -f /tmp/oracle-bundle/compose.json config --no-interpolate --quiet
      - name: Build the owner and support images
        run: |
          docker build --pull -f /tmp/oracle-bundle/owner/Dockerfile.clean -t binana-owner:ci /tmp/oracle-bundle/owner
          docker build --pull -t binana-support:ci /tmp/oracle-bundle/services
      - name: Run every owner regression offline
        run: >-
          docker run --rm --network=none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --memory=2g --cpus=2 --pids-limit=256
          --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 binana-owner:ci
      - name: Validate support imports offline
        run: >-
          docker run --rm --network=none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --memory=1g --cpus=1 --pids-limit=128
          --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777
          --entrypoint python binana-support:ci /app/validate_support.py
      - name: Verify the exact installed Freqtrade version
        run: >-
          docker run --rm --network=none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --entrypoint /usr/local/bin/freqtrade
          binana-owner:ci --version

  artifact:
    needs: [verify, sast, quality-evidence, host-fixtures, dependency-audit, owner-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Package the independently materialized Oracle bundle
        run: |
          python runtime_owner/deployment/materialize_oracle_bundle.py /tmp/oracle-bundle
          mkdir -p /tmp/oracle-artifact
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner --format=posix --pax-option=delete=atime,delete=ctime -C /tmp -cf - oracle-bundle | gzip -n -9 > /tmp/oracle-artifact/oracle-bundle.tar.gz
          cd /tmp/oracle-artifact
          sha256sum oracle-bundle.tar.gz > oracle-bundle.tar.gz.sha256
      - name: Verify freshly extracted release artifact
        run: |
          cd /tmp/oracle-artifact
          sha256sum -c oracle-bundle.tar.gz.sha256
          mkdir -p /tmp/oracle-extracted
          tar -xzf oracle-bundle.tar.gz -C /tmp/oracle-extracted
          cmp /tmp/oracle-bundle/BUNDLE_MANIFEST.json /tmp/oracle-extracted/oracle-bundle/BUNDLE_MANIFEST.json
          python /tmp/oracle-extracted/oracle-bundle/oracle_preflight.py --bundle /tmp/oracle-extracted/oracle-bundle
          docker compose -f /tmp/oracle-extracted/oracle-bundle/compose.json config --no-interpolate --quiet
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oracle-bundle-${{ github.sha }}
          path: /tmp/oracle-artifact/*
          retention-days: 14
          if-no-files-found: error
