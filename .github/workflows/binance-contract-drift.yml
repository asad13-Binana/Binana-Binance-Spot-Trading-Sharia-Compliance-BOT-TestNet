name: Binance Spot contract drift

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binance-contract-drift-${{ github.repository }}
  cancel-in-progress: false

jobs:
  exchange-info:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check current tradeable Spot/USDT filter contract
        shell: bash
        run: |
          set -euo pipefail
          output=$(python scripts/binance_contract_drift.py)
          printf '%s\n' "$output"
          if [[ "$output" == *'"exact_environment": false'* ]]; then
            echo "::warning title=Exact Binance package contract unavailable::The official production public-data contract passed, but exact package-environment metadata must be rechecked from the AWS or Oracle deployment host."
            {
              echo "### Binance contract source degraded"
              echo "GitHub's hosted runner could not reach the exact package-environment endpoint."
              echo "The official production public-data endpoint passed; recheck the exact package environment from the deployment host."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
